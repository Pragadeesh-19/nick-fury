openapi: 3.0.0
info:
  title: Therapy Journal API
  version: 1.0.0
  description: API for clients and therapists to manage therapy journals, sessions, and communication.
servers:
  - url: http://localhost:8080/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StandardResponse:
      type: object
      properties:
        status:
          type: string
          enum:
            - success
            - error
        message:
          type: string
        data:
          type: object
    Client:
      type: object
      properties:
        clientId:
          type: string
        email:
          type: string
        
    ClientCreationInput:
        type: object
        properties:
          email:
            type: string
          password:
            type: string
    Therapist:
      type: object
      properties:
        therapistId:
          type: string
        email:
          type: string
    TherapistCreationInput:
        type: object
        properties:
          email:
            type: string
          password:
            type: string
    Appointment:
      type: object
      properties:
        appointmentId:
          type: string
        therapistId:
          type: string
        clientId:
          type: string
        appointmentTime:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - CANCELLED
    AppointmentCreationInput:
        type: object
        properties:
            therapistId:
                type: string
            clientId:
                type: string
            appointmentTime:
                type: string
    Session:
      type: object
      properties:
        sessionId:
          type: string
        therapistId:
          type: string
        clientId:
          type: string
        sessionTime:
          type: string
          format: date-time
        privateNotes:
          type: string
        sharedNotes:
          type: string
    SessionCreationInput:
        type: object
        properties:
            clientId:
                type: string
            sessionTime:
              type: string
              format: date-time
            privateNotes:
              type: string
            sharedNotes:
              type: string
    Message:
      type: object
      properties:
        messageId:
          type: string
        senderId:
          type: string
        receiverId:
          type: string
        message:
          type: string
        timestamp:
          type: string
          format: date-time
    MessageCreationInput:
        type: object
        properties:
            senderId:
              type: string
            receiverId:
              type: string
            message:
              type: string
    Emotion:
      type: object
      properties:
          emotionId:
              type: string
          clientId:
              type: string
          timeOfEmotion:
              type: string
              format: date-time
          feeling:
              type: string
          intensity:
              type: string
              enum:
                - LOW
                - MEDIUM
                - HIGH
    EmotionCreationInput:
        type: object
        properties:
            timeOfEmotion:
              type: string
              format: date-time
            feeling:
              type: string
            intensity:
              type: string
              enum:
                - LOW
                - MEDIUM
                - HIGH
    JournalAccess:
      type: object
      properties:
          journalAccessId:
            type: string
          clientId:
            type: string
          therapistId:
              type: string
          state:
              type: string
              enum:
                - REQUESTED
                - APPROVED
                - REJECTED
    JournalAccessCreationInput:
      type: object
      properties:
        clientId:
          type: string
        therapistId:
            type: string
paths:
  /auth/register:
    post:
      summary: "[Public] Register a new user (client or therapist)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                userType:
                  type: string
                  enum:
                    - CLIENT
                    - THERAPIST
              required:
                - email
                - password
                - userType
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Client'
                  - $ref: '#/components/schemas/Therapist'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /auth/login:
    post:
      summary: "[Public] Login a user (client or therapist)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                userType:
                  type: string
                  enum:
                    - CLIENT
                    - THERAPIST
              required:
                - email
                - password
                - userType
      responses:
        '200':
          description: User login successful
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Client'
                  - $ref: '#/components/schemas/Therapist'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /therapists/{therapistId}/appointments:
    post:
      summary: "[Therapist] Request for an appointment in an available slot for a therapist"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: therapistId
          required: true
          schema:
            type: string
      requestBody:
          required: true
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/AppointmentCreationInput'
      responses:
          '201':
            description: Successfully requested appointment
            content:
              application/json:
                schema:
                   $ref: '#/components/schemas/Appointment'
          '400':
            description: Bad Request
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/StandardResponse'
          '404':
            description: Client or Therapist not found
            content:
              application/json:
                schema:
                   $ref: '#/components/schemas/StandardResponse'
    get:
      summary: "[Therapist] Get the list of appointments for a therapist, can filter by client"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: therapistId
          required: true
          schema:
            type: string
        - in: query
          name: clientId
          required: false
          schema:
              type: string
      responses:
        '200':
          description: Successfully retreived the list of appointments for the therapist
          content:
            application/json:
              schema:
                type: array
                items:
                    $ref: '#/components/schemas/Appointment'
        '404':
            description: Therapist not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/StandardResponse'
  /appointments/{appointmentId}:
    put:
      summary: "[Therapist/Client] Update an appointment status"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: appointmentId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                  status:
                      type: string
                      enum:
                        - PENDING
                        - CONFIRMED
                        - CANCELLED
              required:
                - status
      responses:
        '200':
          description: Successfully updated the appointment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '400':
            description: Bad Request
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/StandardResponse'
        '404':
            description: Appointment not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/StandardResponse'
  /clients/{clientId}/appointments:
    get:
      summary: "[Client] Get the list of appointments requested by a client"
      security:
          - bearerAuth: []
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retreived the list of appointments for the client
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
        '404':
            description: Client not found
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/StandardResponse'
  /appointments/{appointmentId}/session:
      post:
          summary: "[Therapist] Create a new session with an existing appointment"
          security:
              - bearerAuth: []
          parameters:
              - in: path
                name: appointmentId
                required: true
                schema:
                  type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SessionCreationInput'
          responses:
            '201':
              description: Successfully created a new session
              content:
                  application/json:
                      schema:
                          $ref: '#/components/schemas/Session'
            '400':
                description: Bad request
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/StandardResponse'
      get:
          summary: "[Therapist/Client] Get a session with an existing appointment"
          security:
            - bearerAuth: []
          parameters:
            - in: path
              name: appointmentId
              required: true
              schema:
                type: string
          responses:
              '200':
                description: Successfully fetched the session
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Session'
              '404':
                  description: Session not found
                  content:
                      application/json:
                          schema:
                              $ref: '#/components/schemas/StandardResponse'
      put:
          summary: "[Therapist] Modify details of a session"
          security:
            - bearerAuth: []
          parameters:
              - in: path
                name: appointmentId
                required: true
                schema:
                  type: string
          requestBody:
            required: true
            content:
              application/json:
                schema:
                    $ref: '#/components/schemas/SessionCreationInput'
          responses:
            '200':
              description: Successfully updated the session details
              content:
                  application/json:
                    schema:
                        $ref: '#/components/schemas/Session'
            '400':
              description: Bad request
              content:
                  application/json:
                      schema:
                        $ref: '#/components/schemas/StandardResponse'
  /therapists:
    get:
      summary: "[Client] Search and select for a list of therapist"
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: keyword
          required: false
          schema:
            type: string
      responses:
          '200':
            description: Successfully retrieved search results
            content:
              application/json:
                schema:
                  type: array
                  items:
                    $ref: '#/components/schemas/Therapist'
          '400':
            description: Bad request
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/StandardResponse'
  /clients/{clientId}/emotion-journal:
    post:
      summary: "[Client] Add a new emotion record"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
              type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmotionCreationInput'
      responses:
        '201':
          description: Emotion record added successfully
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/Emotion'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
    get:
      summary: "[Client] Retrieve Emotion records for the client"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: clientId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved list of emotion records
          content:
            application/json:
              schema:
                type: array
                items:
                    $ref: '#/components/schemas/Emotion'
        '404':
          description: Client not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /messages:
    post:
      summary: "[Therapist/Client] Send a message to a therapist or client"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/MessageCreationInput'
      responses:
        '201':
          description: Message sent successfully
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/Message'
        '404':
          description: Client or therapist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
    get:
      summary: "[Therapist/Client] Get the history of messages"
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: senderId
          required: true
          schema:
            type: string
        - in: query
          name: receiverId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved message history
          content:
            application/json:
              schema:
                type: array
                items:
                    $ref: '#/components/schemas/Message'
        '404':
          description: Client or Therapist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /relationships:
    get:
      summary: "[secured] Get the list of therapists or clients based on user type"
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: clientId
          required: false
          schema:
            type: string
        - in: query
          name: therapistId
          required: false
          schema:
              type: string
      responses:
        '200':
          description: Successfully retrieved list of mapped therapists or clients
          content:
            application/json:
              schema:
                type: array
                items:
                    oneOf:
                      - $ref: '#/components/schemas/Client'
                      - $ref: '#/components/schemas/Therapist'
        '404':
          description: Client or Therapist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
    post:
      summary: "[Therapist/Client] Map a therapist to a client"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/JournalAccessCreationInput'
      responses:
        '201':
          description: Therapist mapped to client successfully
          content:
            application/json:
              schema:
                  $ref: '#/components/schemas/JournalAccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
    delete:
      summary: "[Therapist/Client] Remove a relationship between therapist and client"
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: clientId
          required: true
          schema:
            type: string
        - in: query
          name: therapistId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Therapist mapping removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          description: Client or Therapist mapping not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /relationships/journalAccess:
    get:
      summary: "[Therapist/Client] Get a list of Journal Access based on client or therapist"
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: clientId
          required: false
          schema:
            type: string
        - in: query
          name: therapistId
          required: false
          schema:
              type: string
      responses:
        '200':
          description: Successfully retrieved journal access requests
          content:
            application/json:
              schema:
                type: array
                items:
                    $ref: '#/components/schemas/JournalAccess'
        '404':
          description: Client or Therapist mapping not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
    put:
      summary: "[Therapist/Client] Update a journal access request"
      security:
        - bearerAuth: []
      parameters:
          - in: query
            name: journalAccessId
            required: true
            schema:
              type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                  state:
                      type: string
                      enum:
                        - REQUESTED
                        - APPROVED
                        - REJECTED
              required:
                - state
      responses:
          '200':
              description: Successfully updated the journal access request
              content:
                  application/json:
                      schema:
                          $ref: '#/components/schemas/JournalAccess'
          '404':
              description: Journal Access Request not found
              content:
                  application/json:
                      schema:
                        $ref: '#/components/schemas/StandardResponse'
    delete:
      summary: "[Client] Remove a therapist's access to the journal, but not mapping to account"
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: clientId
          required: true
          schema:
            type: string
        - in: query
          name: therapistId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Therapist's journal access removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          description: Client or Therapist mapping not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
    post:
      summary: "[Therapist] Request a new client for journal access"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/JournalAccessCreationInput'
      responses:
        '201':
          description: Successfully requested journal access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalAccess'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '404':
          description: Client or Therapist not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
  /search:
    get:
      summary: "[Therapist/Client] Search for notes and emotions journals"
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: keyword
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardResponse'
